<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Olienzinho">
<title>Olienzinho — Guardião das Estrelas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a0f5a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 40%,#241050 0%,#0b0422 75%);overflow:hidden}
  body{display:grid;place-items:center}
  canvas{display:block;box-shadow:0 0 90px rgba(120,70,255,.28)}
  #splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#2a0f5a 0%,#0b0422 70%);transition:opacity .7s;font-family:Nunito,system-ui,sans-serif}
  #splash.off{opacity:0;pointer-events:none}
  #splash .lg{font-weight:900;font-size:min(9vw,84px);letter-spacing:.06em;color:#fff;text-shadow:0 0 28px #9a63ff,0 0 60px #6a3aff;animation:sp 1.6s ease-in-out infinite alternate}
  #splash .sb{margin-top:6px;font-weight:800;font-size:min(2.4vw,22px);letter-spacing:.3em;color:#ffb340}
  #splash .bar{margin-top:34px;width:min(46vw,360px);height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
  #splash .tx{margin-top:14px;font-weight:700;font-size:min(2vw,16px);letter-spacing:.12em;color:#cdb8ff;min-height:1.4em}
  #splash .bar i.det{animation:none;transition:width .25s}
  #splash .bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#9a63ff,#ffe9a8);animation:ld 1.2s ease-in-out infinite}
  #splash .st{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.6;animation:tw 2.4s ease-in-out infinite}
  @keyframes sp{from{transform:scale(1)}to{transform:scale(1.03)}}
  @keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
</style>
</head>
<body>
<div id="splash"><div class="lg">OLIENZINHO</div><div class="sb">GUARDIÃO DAS ESTRELAS</div><div class="bar"><i></i></div><div class="tx" id="sptx">Acendendo as estrelas…</div></div>
<script>(function(){var s=document.getElementById('splash');for(var i=0;i<30;i++){var d=document.createElement('div');d.className='st';d.style.left=(Math.random()*100)+'%';d.style.top=(Math.random()*100)+'%';d.style.animationDelay=(Math.random()*2.4)+'s';s.appendChild(d);}var MS=['Acendendo as estrelas…','Acordando os guardiões…','Afinando o Coração de Luz…','Quase lá…'],mi=0,tx=document.getElementById('sptx');var iv=setInterval(function(){if(tx&&!window.__det){tx.textContent=MS[++mi%MS.length];}},1100);window.__prog=function(u){try{fetch(u).then(function(r){var L=+r.headers.get('content-length')||0,rd=r.body&&r.body.getReader?r.body.getReader():null;if(!rd)return;var got=0,bar=s.querySelector('.bar i');(function pump(){rd.read().then(function(x){if(x.done){clearInterval(iv);if(tx)tx.textContent='Pronto!';return;}got+=x.value.length;if(L&&bar){window.__det=1;bar.className='det';bar.style.width=Math.min(98,Math.round(got/L*100))+'%';if(tx)tx.textContent='Baixando o céu… '+Math.min(99,Math.round(got/L*100))+'%';}pump();});})();}).catch(function(){});}catch(e){}};addEventListener('load',function(){clearInterval(iv);setTimeout(function(){s.classList.add('off');setTimeout(function(){s.remove();},900);},650);});})();</script>

var DEV = /[?&]dev\b/.test(location.search) || location.hostname === '127.0.0.1' || location.hostname === 'localhost';

else NAMES.forEach(n => document.write('<script src="js/' + n + '.js?t=' + Date.now() + '"><\/script>'));
</script>
</body>
</html>
