<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olienzinho - Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0422;overflow:hidden}
  body{display:grid;place-items:center}
  canvas{display:block;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1280, H = 720;
let K = 1;
const bloom = document.createElement('canvas'), bctx = bloom.getContext('2d');
const FONT = '"Nunito","Segoe UI",Arial,sans-serif';

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = innerWidth, h = innerHeight;
  if (w / h > W / H) w = h * W / H; else h = w * H / W;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  K = cv.width / W;
  bloom.width = Math.round(cv.width / 4); bloom.height = Math.round(cv.height / 4);
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- sprites de brilho (cache por cor) ----------
const glowCache = {};
function glow(color) {
  if (glowCache[color]) return glowCache[color];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, color); gr.addColorStop(0.25, color + 'aa'); gr.addColorStop(1, color + '00');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return glowCache[color] = c;
}
function drawGlow(x, y, r, color, a = 1) {
  ctx.globalAlpha = a; ctx.drawImage(glow(color), x - r, y - r, r * 2, r * 2);
}

// ---------- fundo ----------
function makeNebula(blobs) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  for (const [x, y, r, col, a] of blobs) for (const dy of [-H, 0, H]) {
    const gr = g.createRadialGradient(x, y + dy, 0, x, y + dy, r);
    gr.addColorStop(0, col + Math.round(a * 255).toString(16).padStart(2, '0')); gr.addColorStop(1, col + '00');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  return c;
}
const nebA = makeNebula([[200, 150, 360, '#7a3dff', .22], [1050, 300, 420, '#4b2bd6', .24], [640, 560, 380, '#a76bff', .14], [100, 600, 300, '#3b82ff', .08]]);
const nebB = makeNebula([[900, 120, 300, '#ff6fb0', .16], [250, 460, 340, '#33c4ff', .12], [760, 660, 260, '#ffb340', .07]]);

// cenario vivo: velocidade variavel, parallax lateral, planetas, asteroides, cometas, poeira
let scroll = 1, warp = 0;
const stars = [];
for (let l = 0; l < 3; l++) for (let i = 0; i < [80, 50, 28][l]; i++)
  stars.push({ x: rand(-60, W + 60), y: rand(0, H), l, ph: rand(0, 6.28), sp: [22, 60, 140][l], r: [0.9, 1.5, 2.3][l], par: [.012, .035, .08][l] });
const dust = Array.from({ length: 26 }, () => ({ x: rand(-60, W + 60), y: rand(0, H), sp: rand(520, 900), len: rand(60, 170), a: rand(.06, .2) }));
const PALS = [
  ['#e2d4ff', '#8b4dff', '#3d1290', true], ['#ffd6e8', '#ff6fb0', '#7a1f55', false],
  ['#d6f6ff', '#33c4ff', '#124a8a', true], ['#fff0c9', '#ffb340', '#a2400a', false],
];
function newPlanet(top) {
  const r = rand(38, 130), pal = PALS[Math.floor(rand(0, PALS.length))];
  return { x: rand(100, W - 100), y: top ? -r * 2.2 : rand(-100, H), r, sp: 8 + r * .22, a: rand(.5, .85), pal, tilt: rand(-.6, .2), par: .02 + r / 130 * .07, ph: rand(0, 6) };
}
const planets = [newPlanet(), newPlanet(), newPlanet()];
function newRock(top) {
  const r = Math.random() < .2 ? rand(30, 50) : rand(7, 24), n = 9;
  const pts = Array.from({ length: n }, (_, i) => { const a = i / n * 6.283, k = rand(.7, 1.15); return [Math.cos(a) * r * k, Math.sin(a) * r * k]; });
  return { x: rand(-40, W + 40), y: top ? -80 : rand(0, H), r, pts, sp: rand(50, 130) + r * 4, vx: rand(-25, 25), rot: rand(0, 6), vr: rand(-1.2, 1.2), par: .03 + r * .004, a: r > 28 ? .45 : .85 };
}
const rocks = Array.from({ length: 11 }, () => newRock());
let comet = null, cometT = 3;

function updateScenery(dt) {
  warp = Math.max(0, warp - dt * 3);
  const up = clamp(-P.vy / 500, 0, 1), down = clamp(P.vy / 500, 0, 1);
  const target = 1 + up * .9 - down * .25 + warp + evBoost;
  scroll += (target - scroll) * Math.min(1, 4 * dt);
  for (const s of stars) { s.y += s.sp * scroll * dt; if (s.y > H + 10) { s.y = -10; s.x = rand(-60, W + 60); } }
  for (const d of dust) { d.y += d.sp * scroll * dt; if (d.y - d.len > H) { d.y = -20; d.x = rand(-60, W + 60); d.len = rand(60, 170); } }
  for (const p of planets) {
    p.y += p.sp * scroll * dt;
    if (p.y - p.r * 2.2 > H) Object.assign(p, newPlanet(true));
  }
  for (const k of rocks) {
    k.y += k.sp * scroll * dt; k.x += k.vx * dt; k.rot += k.vr * dt;
    if (k.y > H + 80 || k.x < -120 || k.x > W + 120) Object.assign(k, newRock(true));
  }
  cometT -= dt;
  if (cometT <= 0 && !comet) {
    const dir = Math.random() < .5 ? 1 : -1;
    comet = { x: dir > 0 ? rand(-100, W * .5) : rand(W * .5, W + 100), y: -60, vx: dir * rand(300, 520), vy: rand(520, 760), c: ['#ffffff', '#9fe8ff', '#ffb8dc'][Math.floor(rand(0, 3))] };
  }
  if (comet) {
    comet.x += comet.vx * dt; comet.y += comet.vy * dt;
    if (Math.random() < .6) parts.push({ x: comet.x, y: comet.y, vx: rand(-20, 20), vy: rand(-20, 20), life: .7, max: .7, r: rand(3, 6), c: comet.c, drag: 2 });
    if (comet.y > H + 100) { comet = null; cometT = rand(4, 9); }
  }
}

function drawPlanet(p, cx) {
  const [c0, c1, c2, hasRing] = p.pal;
  ctx.save(); ctx.translate(p.x - cx * p.par, p.y); ctx.rotate(p.tilt + Math.sin(t * .15 + p.ph) * .04); ctx.globalAlpha = p.a;
  const R = p.r, rx = R * 1.72, ry = R * 0.47;
  const ring = (front) => {
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, front ? 0 : Math.PI, front ? Math.PI : 2 * Math.PI);
    ctx.lineWidth = Math.max(2, R * 0.045); ctx.lineCap = 'round';
    ctx.strokeStyle = front ? '#e2d4ff' : 'rgba(226,212,255,.55)'; ctx.stroke();
  };
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; drawGlow(0, 0, R * 1.9, c1, .35); ctx.restore();
  if (hasRing) ring(false);
  const g = ctx.createRadialGradient(-R * .35, -R * .35, R * .05, 0, 0, R * 1.05);
  g.addColorStop(0, c0); g.addColorStop(.45, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
  // faixas girando na superficie
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.clip();
  ctx.globalAlpha = p.a * .18; ctx.fillStyle = c0;
  for (let i = -2; i <= 2; i++) { const yy = i * R * .34 + Math.sin(t * .4 + i + p.ph) * R * .05; ctx.fillRect(-R, yy, R * 2, R * .09); }
  ctx.restore();
  if (hasRing) ring(true);
  ctx.restore();
}

function drawRock(k, cx) {
  ctx.save(); ctx.translate(k.x - cx * k.par, k.y); ctx.rotate(k.rot); ctx.globalAlpha = k.a;
  const g = ctx.createLinearGradient(-k.r, -k.r, k.r, k.r); g.addColorStop(0, '#5a3fb0'); g.addColorStop(1, '#170a3d');
  ctx.beginPath(); k.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = Math.max(1, k.r * .06); ctx.strokeStyle = 'rgba(190,160,255,.45)'; ctx.stroke();
  ctx.restore();
}

function drawScenery() {
  const cx = P.x - W / 2;
  // nebulosas em 2 camadas, respirando e andando em velocidades diferentes
  const ox = -cx * .04, off = (t * 16 * scroll) % H, off2 = (t * 42 * scroll) % H;
  ctx.globalAlpha = .8 + .2 * Math.sin(t * .4); ctx.drawImage(nebA, ox - 60, off, W + 120, H); ctx.drawImage(nebA, ox - 60, off - H, W + 120, H);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .55 + .45 * Math.sin(t * .23 + 1);
  ctx.drawImage(nebB, ox * 2 - 60, off2, W + 120, H); ctx.drawImage(nebB, ox * 2 - 60, off2 - H, W + 120, H);
  // raios de luz
  for (let i = 0; i < 3; i++) {
    ctx.save(); ctx.translate(W * (.2 + i * .3) + Math.sin(t * .12 + i * 2) * 220 - cx * .05, -100); ctx.rotate(.38);
    const g = ctx.createLinearGradient(-130, 0, 130, 0);
    g.addColorStop(0, 'rgba(160,110,255,0)'); g.addColorStop(.5, `rgba(160,110,255,${.06 + .03 * Math.sin(t * .5 + i)})`); g.addColorStop(1, 'rgba(160,110,255,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(-130, 0, 260, 1500); ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
  // estrelas viram riscos quando acelera
  ctx.lineCap = 'round'; ctx.strokeStyle = '#e8e0ff';
  for (const s of stars) {
    const x = s.x - cx * s.par, len = s.sp * (.03 + (scroll - 1) * .06);
    ctx.globalAlpha = (.35 + s.l * .25) * (.65 + .35 * Math.sin(t * 2 + s.ph)); ctx.lineWidth = s.r * 1.5;
    ctx.beginPath(); ctx.moveTo(x, s.y); ctx.lineTo(x, s.y - len); ctx.stroke();
  }
  for (const p of planets) drawPlanet(p, cx);
  drawEventBack(cx);
  for (const k of rocks) if (k.a < .5) drawRock(k, cx);
  for (const k of rocks) if (k.a >= .5) drawRock(k, cx);
  if (comet) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const d = Math.hypot(comet.vx, comet.vy), tx = comet.x - comet.vx / d * 280, ty = comet.y - comet.vy / d * 280;
    const g = ctx.createLinearGradient(comet.x, comet.y, tx, ty); g.addColorStop(0, comet.c); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = .9; ctx.strokeStyle = g; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(comet.x, comet.y); ctx.lineTo(tx, ty); ctx.stroke();
    drawGlow(comet.x, comet.y, 40, comet.c, .9); ctx.restore();
  }
  // poeira rapida em primeiro plano
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = '#cdb8ff'; ctx.lineWidth = 1.5;
  for (const d of dust) { ctx.globalAlpha = d.a * (.6 + (scroll - 1) * .3); ctx.beginPath(); ctx.moveTo(d.x - cx * .15, d.y); ctx.lineTo(d.x - cx * .15, d.y - d.len * scroll * .7); ctx.stroke(); }
  ctx.restore();
  drawEventFront();
  ctx.globalAlpha = 1;
}

// ---------- eventos grandes ----------
let ev = null, evTimer = 12, evLast = '', evBoost = 0, evBanner = null, evFlash = 0, evBolts = [];
const EVENTS = {
  giant: ['PLANETA GIGANTE', 'Passando bem perto!', '#b98cff'],
  rain: ['ALERTA!', 'Chuva de asteroides', '#ff8a5f'],
  storm: ['TEMPESTADE IÔNICA', 'Cuidado com os raios', '#ff7ac8'],
  worm: ['BURACO DE MINHOCA', 'Hiperespaço! Horda a caminho', '#7fe0ff'],
};
const EV_DUR = { giant: 16, rain: 11, storm: 11, worm: 8 };
const EV_ORDER = ['giant', 'rain', 'storm', 'worm'];

function startEvent(name) {
  ev = { name, t: 0, dur: EV_DUR[name], boltT: 1, mT: 0 };
  evLast = name;
  const [a, b, c] = EVENTS[name];
  evBanner = { t: 0, title: a, sub: b, c };
  if (name === 'giant') {
    const pal = PALS[Math.floor(rand(0, PALS.length))];
    ev.p = { x: rand(W * .3, W * .7), y: -420, r: 320, a: 1, pal, tilt: rand(-.4, .2), par: .12, ph: rand(0, 6) };
  }
  if (name === 'worm') {
    ev.lines = Array.from({ length: 80 }, () => ({ a: rand(0, 6.283), r: rand(10, 600), v: rand(.6, 1.4), c: Math.random() < .5 ? '#b98cff' : '#7fe0ff' }));
  }
}

function endEvent() {
  if (ev && ev.name === 'worm') { evFlash = .9; flash = .3; shake = 14; shockwave(W / 2, H * .38, 800, '#7fe0ff'); }
  ev = null; evTimer = rand(16, 26);
}

function spawnMeteor() {
  const r = rand(16, 36), n = 9;
  const pts = Array.from({ length: n }, (_, i) => { const a = i / n * 6.283, k = rand(.72, 1.12); return [Math.cos(a) * r * k, Math.sin(a) * r * k]; });
  enemies.push({ kind: 'rock', x: rand(40, W - 40), y: -50, vx: rand(-110, 110), vy: rand(260, 460), rad: r + 4, hp: r > 27 ? 3 : 2, hit: 0, age: 0, rot: rand(0, 6), vr: rand(-2, 2), pts });
}

function makeBolt() {
  const segs = []; let x = rand(100, W - 100), y = -10;
  const endY = rand(H * .45, H * .85);
  while (y < endY) { segs.push([x, y]); x += rand(-38, 38); y += rand(28, 52); }
  const branches = [];
  for (let i = 0; i < 2; i++) {
    const s = segs[Math.floor(rand(2, segs.length - 1))]; if (!s) continue;
    const br = []; let bx = s[0], by = s[1];
    for (let k = 0; k < 4; k++) { br.push([bx, by]); bx += rand(-50, 50); by += rand(20, 40); }
    branches.push(br);
  }
  evBolts.push({ segs, branches, life: 1 });
  evFlash = .4; shake = Math.max(shake, 8);
}

function updateEvent(dt) {
  if (evBanner) { evBanner.t += dt; if (evBanner.t > 3.2) evBanner = null; }
  evFlash = Math.max(0, evFlash - dt * 1.6);
  for (const b of evBolts) b.life -= dt * 3;
  evBolts = evBolts.filter(b => b.life > 0);

  if (!ev) {
    evBoost += (0 - evBoost) * Math.min(1, 3 * dt);
    evTimer -= dt;
    if (evTimer <= 0) { const n = EV_ORDER.filter(k => k !== evLast); startEvent(n[Math.floor(rand(0, n.length))]); }
    return;
  }
  ev.t += dt;
  if (ev.name === 'giant') {
    ev.p.y += 105 * dt;
    if (ev.p.y - ev.p.r * 1.4 > H) endEvent();
  } else if (ev.name === 'rain') {
    evBoost = .45;
    if (ev.t > 2.4 && ev.t < ev.dur - 1) { ev.mT -= dt; if (ev.mT <= 0) { spawnMeteor(); ev.mT = rand(.1, .2); } }
    if (ev.t >= ev.dur) endEvent();
  } else if (ev.name === 'storm') {
    evBoost = .6;
    ev.boltT -= dt; if (ev.boltT <= 0 && ev.t < ev.dur - 1) { makeBolt(); ev.boltT = rand(.5, 1.5); }
    if (ev.t >= ev.dur) endEvent();
  } else if (ev.name === 'worm') {
    if (ev.t < ev.dur - .8) warp = Math.max(warp, 3.5);
    for (const l of ev.lines) { l.r = l.r * (1 + 2.2 * dt * l.v) + 60 * dt; if (l.r > 1000) { l.r = rand(5, 40); l.a = rand(0, 6.283); } }
    if (ev.t >= ev.dur) endEvent();
  }
}

function drawEventBack(cx) {
  if (ev && ev.name === 'giant') drawPlanet(ev.p, cx);
}

function drawEventFront() {
  if (!ev && !evBolts.length) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  if (ev && ev.name === 'storm') {
    ctx.globalAlpha = .07 + .03 * Math.sin(t * 3); ctx.fillStyle = '#ff3d9a'; ctx.fillRect(0, 0, W, H);
  }
  for (const b of evBolts) {
    const path = (pts) => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); };
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.globalAlpha = .25 * b.life; ctx.strokeStyle = '#c9a0ff'; ctx.lineWidth = 14; path(b.segs); b.branches.forEach(path);
    ctx.globalAlpha = b.life; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; path(b.segs); ctx.lineWidth = 1.5; b.branches.forEach(path);
  }
  if (ev && ev.name === 'worm') {
    const cx = W / 2, cy = H * .38, fade = Math.max(0, Math.min(1, ev.t / .8, (ev.dur - ev.t) / .8));
    drawGlow(cx, cy, 300 + Math.sin(t * 4) * 20, '#7fe0ff', .35 * fade);
    drawGlow(cx, cy, 160, '#ffffff', .4 * fade);
    ctx.lineCap = 'round';
    for (const l of ev.lines) {
      const len = l.r * .4 + 12, c = Math.cos(l.a), s = Math.sin(l.a);
      ctx.globalAlpha = Math.min(1, l.r / 160) * .8 * fade; ctx.strokeStyle = l.c; ctx.lineWidth = 1 + l.r / 260;
      ctx.beginPath(); ctx.moveTo(cx + c * l.r, cy + s * l.r * .75); ctx.lineTo(cx + c * (l.r + len), cy + s * (l.r + len) * .75); ctx.stroke();
    }
    for (let i = 0; i < 4; i++) {
      const k = ((t * .6 + i / 4) % 1), rr = 40 + k * 420;
      ctx.globalAlpha = (1 - k) * .5 * fade; ctx.strokeStyle = '#b98cff'; ctx.lineWidth = 2 + k * 6;
      ctx.beginPath(); ctx.ellipse(cx, cy, rr, rr * .75, 0, 0, 7); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawEventOverlay() {
  ctx.save();
  if (ev && ev.name === 'rain' && ev.t < 2.6) {
    const a = (.5 + .5 * Math.sin(ev.t * 9)) * .38;
    const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .9);
    g.addColorStop(0, 'rgba(255,60,60,0)'); g.addColorStop(1, `rgba(255,60,60,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (evFlash > 0) { ctx.globalAlpha = Math.min(1, evFlash * .6); ctx.fillStyle = '#e9e0ff'; ctx.fillRect(0, 0, W, H); }
  if (evBanner) {
    const b = evBanner, a = Math.max(0, Math.min(1, b.t / .4, (3.2 - b.t) / .6)), slide = (1 - Math.min(1, b.t / .4)) * -30;
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.shadowColor = b.c; ctx.shadowBlur = 30; ctx.fillStyle = '#fff'; ctx.font = `900 46px ${FONT}`; ctx.fillText(b.title, W / 2, 100 + slide);
    ctx.shadowBlur = 0; ctx.fillStyle = b.c; ctx.font = `700 22px ${FONT}`; ctx.fillText(b.sub, W / 2, 156 + slide);
  }
  ctx.restore();
}

function drawMeteor(e) {
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; drawGlow(0, 0, e.rad * 2.4, '#ff6a1a', .4); ctx.restore();
  const g = ctx.createLinearGradient(-e.rad, -e.rad, e.rad, e.rad);
  g.addColorStop(0, e.hit > 0 ? '#ffffff' : '#7a58c0'); g.addColorStop(1, '#1a0c45');
  ctx.beginPath(); e.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#ff9a3c'; ctx.stroke();
  ctx.restore();
}

// ---------- estado ----------
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault(); if (e.key >= '1' && e.key <= '4') startEvent(EV_ORDER[+e.key - 1]); });
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
let mouse = null;
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  mouse = { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
});

const P = { x: W / 2, y: H - 130, vx: 0, vy: 0, hp: 5, maxHp: 5, inv: 0, fire: 0, shots: 1, blink: 3, blinkT: 0, lookx: 0, looky: 0 };
let enemies = [], bullets = [], parts = [], rings = [], pops = [];
let score = 0, kills = 0, level = 1, xp = 0, shake = 0, spawnT = 1, t = 0, flash = 0, lvlBanner = 0;
const need = () => 5 + level * 3;

function burst(x, y, colors, n, sp = 260, size = 5) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), s = rand(.25, 1) * sp;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.4, .9), max: .9, r: rand(.5, 1) * size, c: colors[i % colors.length], drag: 2.6 });
  }
}
function shockwave(x, y, max, c) { rings.push({ x, y, r: 6, max, c, life: 1 }); }
function popup(x, y, text, c = '#ffe9a8') { pops.push({ x, y, text, c, life: 1 }); }

function spawnEnemy() {
  enemies.push({ x: rand(80, W - 80), bx: 0, y: -40, ph: rand(0, 6.28), amp: rand(30, 110), fr: rand(1, 2), sp: rand(70, 120) + level * 6, hp: 1, hit: 0, age: 0 });
  enemies[enemies.length - 1].bx = enemies[enemies.length - 1].x;
}

function levelUp() {
  level++; xp = 0; P.shots = Math.min(3, P.shots + (level % 2 === 0 ? 1 : 0)); P.hp = P.maxHp;
  lvlBanner = 2; shake = 10; flash = .25; warp = 7;
  shockwave(P.x, P.y, 420, '#b98cff'); shockwave(P.x, P.y, 260, '#ffb340');
  burst(P.x, P.y, ['#b98cff', '#ffb340', '#ffffff'], 70, 480, 6);
}

// ---------- update ----------
function update(dt) {
  t += dt;
  // movimento: teclado ou mouse
  let ax = 0, ay = 0;
  if (keys['a'] || keys['arrowleft']) ax -= 1; if (keys['d'] || keys['arrowright']) ax += 1;
  if (keys['w'] || keys['arrowup']) ay -= 1; if (keys['s'] || keys['arrowdown']) ay += 1;
  if (ax || ay) { mouse = null; const m = Math.hypot(ax, ay); ax /= m; ay /= m; P.vx += (ax * 520 - P.vx) * Math.min(1, 10 * dt); P.vy += (ay * 520 - P.vy) * Math.min(1, 10 * dt); }
  else if (mouse) { P.vx += ((mouse.x - P.x) * 9 - P.vx) * Math.min(1, 12 * dt); P.vy += ((mouse.y - P.y) * 9 - P.vy) * Math.min(1, 12 * dt); }
  else { P.vx *= 1 - Math.min(1, 6 * dt); P.vy *= 1 - Math.min(1, 6 * dt); }
  P.x = clamp(P.x + P.vx * dt, 50, W - 50); P.y = clamp(P.y + P.vy * dt, 80, H - 70);

  // olhar
  let tx = P.vx / 500, ty = P.vy / 500;
  let best = 1e9, tgt = null;
  for (const e of enemies) { const d = Math.hypot(e.x - P.x, e.y - P.y); if (d < best) { best = d; tgt = e; } }
  if (tgt) { const d = Math.hypot(tgt.x - P.x, tgt.y - P.y) || 1; tx = (tgt.x - P.x) / d; ty = (tgt.y - P.y) / d; }
  P.lookx += (tx - P.lookx) * Math.min(1, 8 * dt); P.looky += (ty - P.looky) * Math.min(1, 8 * dt);
  P.blink -= dt; if (P.blink <= 0) { P.blinkT = .16; P.blink = rand(2, 5); }
  if (P.blinkT > 0) P.blinkT -= dt;
  P.inv = Math.max(0, P.inv - dt);

  // tiro automatico
  P.fire -= dt;
  if (P.fire <= 0) {
    P.fire = 0.17;
    for (let i = 0; i < P.shots; i++) {
      const k = i - (P.shots - 1) / 2;
      bullets.push({ x: P.x + k * 22, y: P.y - 62, vx: k * 55, vy: -900 });
    }
  }

  // chama do foguete
  for (let i = 0; i < 2; i++)
    parts.push({ x: P.x + rand(-6, 6), y: P.y + 42, vx: rand(-30, 30) + P.vx * -.1, vy: rand(150, 280), life: rand(.25, .5), max: .5, r: rand(3, 7), c: Math.random() < .5 ? '#ffb340' : '#ffe9a8', drag: 1 });

  // spawn
  spawnT -= dt;
  if (spawnT <= 0) { spawnEnemy(); spawnT = Math.max(.32, .85 - level * .04) * (ev && ev.name === 'worm' ? .4 : ev && ev.name === 'rain' ? 1.6 : 1); }

  // inimigos
  for (const e of enemies) {
    e.age += dt; e.hit = Math.max(0, e.hit - dt);
    if (e.kind === 'rock') {
      e.x += e.vx * dt; e.y += e.vy * dt; e.rot += e.vr * dt;
      if (Math.random() < .5) parts.push({ x: e.x + rand(-6, 6), y: e.y - e.rad * .6, vx: rand(-30, 30), vy: rand(-120, -40), life: .35, max: .35, r: rand(3, 6), c: '#ff8a1f', drag: 2 });
      if (e.x < -80 || e.x > W + 80) e.dead = true;
    } else { e.y += e.sp * dt; e.x = e.bx + Math.sin(e.age * e.fr + e.ph) * e.amp; }
    if (P.inv <= 0 && Math.hypot(e.x - P.x, e.y - P.y) < (e.rad || 24) + 22) {
      e.dead = true; P.hp--; P.inv = 1.4; shake = 16; flash = .3;
      burst(e.x, e.y, ['#ffb340', '#ff7a1a'], 20); shockwave(e.x, e.y, 120, '#ffb340');
      if (P.hp <= 0) { P.hp = P.maxHp; popup(P.x, P.y - 70, 'REPARO!', '#ff9ac0'); }
    }
    if (e.y > H + 60) e.dead = true;
  }
  // tiros x inimigos
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -40) b.dead = true;
    for (const e of enemies) if (!e.dead && Math.hypot(e.x - b.x, e.y - b.y) < (e.rad || 24) + 10) {
      b.dead = true; e.hp--; e.hit = .08;
      parts.push(...Array.from({ length: 4 }, () => ({ x: b.x, y: b.y, vx: rand(-160, 160), vy: rand(-60, 160), life: .25, max: .25, r: 3, c: '#e2d4ff', drag: 3 })));
      if (e.hp <= 0) {
        e.dead = true; kills++; score += 10; xp++;
        burst(e.x, e.y, e.kind === 'rock' ? ['#ff9a3c', '#b98cff', '#ffffff', '#7a58c0'] : ['#ffb340', '#ff7a1a', '#ffe9a8', '#b98cff'], 26, 300, 6); shockwave(e.x, e.y, 90, '#ffb340');
        shake = Math.max(shake, 5); popup(e.x, e.y - 20, '+10');
        if (xp >= need()) levelUp();
      }
      break;
    }
  }
  enemies = enemies.filter(e => !e.dead); bullets = bullets.filter(b => !b.dead);

  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; const d = Math.max(0, 1 - p.drag * dt); p.vx *= d; p.vy *= d; }
  parts = parts.filter(p => p.life > 0).slice(-700);
  for (const r of rings) { r.r += (r.max - r.r) * Math.min(1, 7 * dt) + 20 * dt; r.life -= dt * 2.2; }
  rings = rings.filter(r => r.life > 0);
  for (const p of pops) { p.y -= 50 * dt; p.life -= dt * 1.2; }
  pops = pops.filter(p => p.life > 0);
  shake = Math.max(0, shake - 40 * dt); flash = Math.max(0, flash - dt); lvlBanner = Math.max(0, lvlBanner - dt);
  updateScenery(dt);
  updateEvent(dt);
}

// ---------- desenho ----------
function drawEnemy(e) {
  if (e.kind === 'rock') return drawMeteor(e);
  const r = 24;
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.sin(e.age * 3 + e.ph) * .15);
  ctx.globalCompositeOperation = 'lighter'; drawGlow(0, 0, 54, '#ff8a1f', .55);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, e.hit > 0 ? '#ffffff' : '#ffd37a'); g.addColorStop(1, e.hit > 0 ? '#ffd0d0' : '#ff7a1a');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(120,40,0,.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r - 1.5, 0, 7); ctx.stroke();
  ctx.fillStyle = '#2a0f5e'; ctx.beginPath(); ctx.roundRect(-r * .68, -r * .18, r * 1.36, r * .42, 7); ctx.fill();
  ctx.fillStyle = '#ffe9a8'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * r * .3, r * .03, 3.2, 0, 7); ctx.fill(); }
  ctx.strokeStyle = '#ffb340'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, -r - 10); ctx.stroke();
  ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(0, -r - 11, 4, 0, 7); ctx.fill();
  ctx.restore();
}

function drawPlayer() {
  const U = 112;
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(clamp(P.vx / 520, -1, 1) * 0.24);
  if (P.inv > 0 && Math.floor(P.inv * 14) % 2 === 0) ctx.globalAlpha = .4;
  const X = x => x * U, Y = y => -(y - .75) * U;
  // brilho ao redor
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; drawGlow(0, 0, 110, '#8b4dff', .3); ctx.restore();
  // chama
  const fl = 0.55 + Math.sin(t * 60) * .06 + Math.random() * .12;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const fg = ctx.createLinearGradient(0, Y(.2), 0, Y(.2 - fl));
  fg.addColorStop(0, '#fff1c1'); fg.addColorStop(.35, '#ffb340'); fg.addColorStop(1, 'rgba(255,100,20,0)');
  ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(X(-.1), Y(.22)); ctx.quadraticCurveTo(X(-.13), Y(.2 - fl * .55), 0, Y(.2 - fl));
  ctx.quadraticCurveTo(X(.13), Y(.2 - fl * .55), X(.1), Y(.22)); ctx.closePath(); ctx.fill(); ctx.restore();
  // aletas
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#5b2fc0'; ctx.beginPath(); ctx.moveTo(X(s * .15), Y(.78)); ctx.lineTo(X(s * .44), Y(.25)); ctx.lineTo(X(s * .15), Y(.30)); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.moveTo(X(s * .15), Y(.78)); ctx.lineTo(X(s * .3), Y(.52)); ctx.lineTo(X(s * .15), Y(.5)); ctx.closePath(); ctx.fill();
  }
  // bocal
  ctx.fillStyle = '#3f2290'; ctx.beginPath(); ctx.roundRect(X(-.085), Y(.27), X(.17), U * .1, 4); ctx.fill();
  // corpo
  const body = () => { ctx.beginPath(); ctx.moveTo(X(-.17), Y(.25)); ctx.lineTo(X(-.2), Y(.8));
    ctx.bezierCurveTo(X(-.2), Y(1.15), X(-.08), Y(1.38), 0, Y(1.45)); ctx.bezierCurveTo(X(.08), Y(1.38), X(.2), Y(1.15), X(.2), Y(.8)); ctx.lineTo(X(.17), Y(.25)); ctx.closePath(); };
  const bg = ctx.createLinearGradient(X(-.2), 0, X(.2), 0);
  bg.addColorStop(0, '#c6a6ff'); bg.addColorStop(.35, '#9a63ff'); bg.addColorStop(1, '#5326b8');
  body(); ctx.fillStyle = bg; ctx.fill();
  ctx.save(); body(); ctx.clip(); ctx.fillStyle = 'rgba(226,212,255,.95)'; ctx.fillRect(X(-.3), Y(.56), X(.6), U * .06); ctx.restore();
  // olho
  const ey = Y(.98), eh = P.blinkT > 0 ? Math.max(.08, Math.abs(P.blinkT - .08) / .08) : 1;
  ctx.fillStyle = '#f5eeff'; ctx.beginPath(); ctx.ellipse(0, ey, U * .125, U * .125 * eh, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#1b0b3d'; ctx.beginPath(); ctx.ellipse(P.lookx * U * .03, ey + P.looky * U * .03, U * .088, U * .088 * eh, 0, 0, 7); ctx.fill();
  if (eh > .5) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(P.lookx * U * .03 + U * .03, ey + P.looky * U * .03 - U * .03, U * .025, 0, 7); ctx.fill(); }
  ctx.restore();
}

function render() {
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#2a1478'); bg.addColorStop(1, '#0b0422');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(rand(-1, 1) * shake, rand(-1, 1) * shake);
  drawScenery();
  ctx.globalAlpha = 1;

  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) drawGlow(p.x, p.y, p.r * 2.4, p.c, clamp(p.life / p.max, 0, 1));
  for (const r of rings) { ctx.globalAlpha = r.life * .8; ctx.strokeStyle = r.c; ctx.lineWidth = 4 * r.life + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke(); }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  for (const e of enemies) drawEnemy(e);
  for (const b of bullets) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; drawGlow(b.x, b.y, 26, '#b98cff', .9); drawGlow(b.x, b.y + 16, 16, '#b98cff', .6); ctx.restore();
    ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(b.x - 3, b.y - 18, 6, 36, 3); ctx.fill();
  }
  drawPlayer();
  ctx.restore();
  drawEventOverlay();

  // HUD
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, 0, W, 8);
  ctx.fillStyle = '#8b4dff'; ctx.fillRect(0, 0, W * clamp(xp / need(), 0, 1), 8);
  ctx.font = `900 26px ${FONT}`; ctx.textBaseline = 'top'; ctx.fillStyle = '#e2d4ff';
  ctx.textAlign = 'left'; ctx.fillText('NÍVEL ' + level, 24, 22);
  for (let i = 0; i < P.maxHp; i++) { ctx.fillStyle = i < P.hp ? '#ff5f8f' : 'rgba(255,255,255,.15)'; ctx.beginPath(); ctx.roundRect(24 + i * 38, 60, 30, 12, 6); ctx.fill(); }
  ctx.fillStyle = '#e2d4ff'; ctx.textAlign = 'right'; ctx.fillText(score + ' pts', W - 24, 22);
  ctx.textAlign = 'center'; ctx.font = `700 15px ${FONT}`; ctx.globalAlpha = .55;
  ctx.fillText('WASD / setas ou mouse para mover  •  tiro automático  •  teclas 1-4: eventos', W / 2, H - 28); ctx.globalAlpha = 1;
  for (const p of pops) { ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.c; ctx.font = `900 24px ${FONT}`; ctx.fillText(p.text, p.x, p.y); }
  ctx.globalAlpha = 1;
  if (lvlBanner > 0) {
    const a = clamp(lvlBanner, 0, 1), s = 1 + (2 - lvlBanner) * .02;
    ctx.save(); ctx.translate(W / 2, H * .3); ctx.scale(s, s); ctx.globalAlpha = a;
    ctx.font = `900 84px ${FONT}`; ctx.fillStyle = '#fff'; ctx.shadowColor = '#8b4dff'; ctx.shadowBlur = 40; ctx.fillText('NÍVEL ' + level + '!', 0, -40);
    ctx.restore();
  }
  if (flash > 0) { ctx.globalAlpha = flash; ctx.fillStyle = '#e2d4ff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }

  // bloom: realca so o que e claro
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.clearRect(0, 0, bloom.width, bloom.height);
  bctx.filter = 'contrast(1.6) brightness(1.15) blur(5px)';
  bctx.drawImage(cv, 0, 0, bloom.width, bloom.height); bctx.filter = 'none';
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .55;
  ctx.drawImage(bloom, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
